[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../../lib"]
remappings = ["forge-std/=../../../lib/forge-std/src/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
deny = "warnings"
# The deploy script may write the deployment manifest, nothing else.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000
