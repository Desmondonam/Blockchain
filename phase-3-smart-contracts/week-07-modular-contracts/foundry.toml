[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../lib"]
remappings = ["forge-std/=../../lib/forge-std/src/"]

# Pin the compiler: reproducible builds, no surprise upgrades.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Treat compiler warnings as errors (Definition of Done: zero warnings).
deny = "warnings"

[fuzz]
runs = 1000

[fmt]
line_length = 100
